<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحليلات ألورا</title>
<style>
:root{--bg:#F5F7FB;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e8ecf3;--soft:#f1f5f9;--bad:#e11d48;--em:#10b981;--in:#6366f1;--cy:#06b6d4;--ro:#f43f5e;--am:#f59e0b;--vi:#8b5cf6;
--sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--in);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
svg{display:block;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.in{background:var(--in)}.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}
.lbox{background:var(--card);border-radius:20px;padding:30px 24px;width:min(380px,100%);text-align:center;display:flex;flex-direction:column;gap:13px;box-shadow:var(--sh)}
.lbox .lg{width:52px;height:52px;border-radius:16px;background:#eef2ff;color:var(--in);display:grid;place-items:center;margin:0 auto}.lbox .lg svg{width:24px;height:24px}
.lbox h1{font-size:18px;margin:0}.lbox p{margin:0;color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:19px}
.lang{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}.lang button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mut)}.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
#login .lang{position:absolute;top:16px;inset-inline-end:16px}
header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:190px}.brand .lg{width:34px;height:34px;border-radius:10px;background:var(--in);color:#fff;display:grid;place-items:center}.brand .lg svg{width:18px;height:18px}
.brand h1{font-size:16px;margin:0;line-height:1.2}.brand small{display:block;color:var(--mut);font-size:11.5px}
main{max-width:1320px;margin:0 auto;padding:16px 18px 40px}
.note{display:flex;gap:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:12.5px;line-height:1.8;color:#92400e}.note svg{width:18px;height:18px;margin-top:3px;color:var(--am)}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;margin-bottom:14px}
.filters label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;padding:15px;box-shadow:var(--sh);border:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.kpi .ic svg{width:20px;height:20px}
.kpi .tx{min-width:0;flex:1}.kpi span{display:block;font-size:12.5px;color:var(--mut);font-weight:600}.kpi b{display:block;font-size:24px;line-height:1.25;margin-top:2px;word-break:break-word}.kpi b.t{font-size:16px;margin-top:5px}
.kpi small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.c-em{background:#ecfdf5;color:#059669}.c-in{background:#eef2ff;color:#4f46e5}.c-cy{background:#ecfeff;color:#0891b2}.c-ro{background:#fff1f2;color:#e11d48}.c-am{background:#fffbeb;color:#d97706}.c-vi{background:#f5f3ff;color:#7c3aed}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:14px}
.ch{padding:14px}.ch h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}.ch h3 svg{width:17px;height:17px;color:var(--mut)}.ch h3 small{color:var(--mut);font-weight:400;font-size:11.5px}
.ch.w{grid-column:1/-1}.cv{position:relative;height:250px}.ch.w .cv{height:285px}
.wl h3 svg{color:var(--ro)}.wl p{margin:-4px 0 10px;color:var(--mut);font-size:12px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--soft);text-align:start;padding:9px 10px;white-space:nowrap;font-weight:700;color:#475569}
td{padding:9px 10px;border-top:1px solid var(--line);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tr:hover td{background:#fafbfe}
.num{text-align:end;font-variant-numeric:tabular-nums}.rank{width:34px;color:var(--mut)}
.empty{padding:26px;text-align:center;color:var(--mut)}
details.raw{padding:0;overflow:hidden}details.raw summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:14px}
details.raw summary::-webkit-details-marker{display:none}details.raw summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--mut)}details.raw[open] summary .chev{transform:rotate(180deg)}
details.raw summary svg{width:18px;height:18px;color:var(--in)}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap;border-top:1px solid var(--line);color:var(--mut)}
</style>
</head>
<body>

<div id="login">
  <div class="lang" data-lang-switch><button type="button" data-l="ar">AR</button><button type="button" data-l="en">EN</button></div>
  <form class="lbox" id="lf" autocomplete="off">
    <div class="lg"><i data-ic="lock"></i></div>
    <h1 data-i="login_title"></h1>
    <p data-i="login_hint"></p>
    <input type="password" id="pw" data-ph="pw_ph" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn in" id="lgo" type="submit" style="justify-content:center" data-i="enter"></button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="lg"><i data-ic="chart"></i></div><div><h1 data-i="title"></h1><small id="upd"></small></div></div>
    <div class="lang" data-lang-switch><button type="button" data-l="ar">AR</button><button type="button" data-l="en">EN</button></div>
    <label style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px"><span data-i="load"></span>
      <select id="range"><option value="0" data-i="r_all"></option><option value="30" data-i="r_30"></option><option value="90" data-i="r_90"></option></select>
    </label>
    <button class="btn" id="refresh" type="button"><i data-ic="refresh"></i><span data-i="refresh"></span></button>
    <button class="btn o" id="logout" type="button"><i data-ic="logout"></i><span data-i="logout"></span></button>
  </header>
  <main>
    <div class="note" id="note" hidden><i data-ic="alert"></i><div id="noteTx"></div></div>

    <div class="panel filters">
      <label><span data-i="from"></span><input type="date" id="fFrom"></label>
      <label><span data-i="to"></span><input type="date" id="fTo"></label>
      <label><span data-i="city"></span><select id="fCity"></select></label>
      <button class="btn o" id="fReset" type="button"><i data-ic="reset"></i><span data-i="reset"></span></button>
    </div>

    <section class="cards" id="cards"></section>

    <section class="grid2">
      <div class="panel ch w"><h3><i data-ic="trend"></i><span data-i="c_trend"></span></h3><div class="cv"><canvas id="cTrend"></canvas></div></div>
      <div class="panel ch wl">
        <h3><i data-ic="heart"></i><span data-i="w_title"></span></h3>
        <p data-i="w_hint"></p>
        <div class="scroll"><table><thead id="wlHead"></thead><tbody id="wlBody"></tbody></table></div>
        <div style="margin-top:12px"><button class="btn o" id="wlExport" type="button"><i data-ic="download"></i><span data-i="w_export"></span></button></div>
      </div>
      <div class="panel ch"><h3><i data-ic="activity"></i><span data-i="c_events"></span> <small data-i="c_events_hint"></small></h3><div class="cv"><canvas id="cEvents"></canvas></div></div>
      <div class="panel ch"><h3><i data-ic="device"></i><span data-i="c_dev"></span></h3><div class="cv"><canvas id="cDev"></canvas></div></div>
      <div class="panel ch"><h3><i data-ic="pin"></i><span data-i="c_city"></span></h3><div class="cv"><canvas id="cCity"></canvas></div></div>
      <div class="panel ch"><h3><i data-ic="package"></i><span data-i="c_prod"></span></h3><div class="cv"><canvas id="cProd"></canvas></div></div>
    </section>

    <details class="panel raw" id="raw">
      <summary><i data-ic="table"></i><span data-i="raw_title"></span><span class="chev"><i data-ic="chev"></i></span></summary>
      <div class="tbar">
        <input id="fQ" type="search" data-ph="search_ph" style="flex:1 1 220px">
        <select id="fEvent"></select>
        <select id="perPage"><option>25</option><option>50</option><option>100</option></select>
        <button class="btn" id="csv" type="button"><i data-ic="download"></i><span data-i="csv"></span></button>
      </div>
      <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="pg"><button class="btn o" id="prev" type="button" data-i="prev"></button><span id="pinfo"></span><button class="btn o" id="next" type="button" data-i="next"></button></div>
    </details>
  </main>
</div>

  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  device: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
  table: '<path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ""}</svg>`;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => Number(n).toLocaleString("en");
const DAY = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const TIME = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const fmtT = ts => { if (!ts) return ""; const p = Object.fromEntries(TIME.formatToParts(ts).map(x => [x.type, x.value])); const h = Number(p.hour) % 24; return `${p.day}-${p.month}-${p.year} | ${String(h % 12 || 12).padStart(2, "0")}:${p.minute} ${h >= 12 ? t("pm") : t("am")}`; };
/* ألوان الرسوم: Emerald / Indigo / Cyan / Rose + مكملات */
const PAL = ["#6366f1", "#10b981", "#06b6d4", "#f43f5e", "#f59e0b", "#8b5cf6", "#64748b", "#14b8a6", "#ec4899", "#94a3b8"];

let KEY = "", COLS = [], ROWS = [], BASE = [], FILT = [], MISSING = [], page = 1, CH = {}, LOADED = false;

/* ---------- تطبيق اللغة والاتجاه ---------- */
function applyLang() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr"; document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  document.querySelectorAll("[data-lang-switch] button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  if (LOADED) { fillFilters(); setNote(); $("#upd").textContent = t("upd") + fmtT(LASTUPD); render(); }
}
document.querySelectorAll("[data-lang-switch] button").forEach(b => b.onclick = () => { LANG = b.dataset.l; localStorage.setItem("alora_dash_lang", LANG); applyLang(); });
document.querySelectorAll("[data-ic]").forEach(e => e.innerHTML = icon(e.dataset.ic));
let LASTUPD = 0;

/* ---------- تسجيل الدخول: الكلمة تُرسل للسكربت ويتحقق منها هناك ---------- */
$("#lf").addEventListener("submit", e => { e.preventDefault(); KEY = $("#pw").value; load(true); });
$("#logout").onclick = () => { sessionStorage.removeItem("alora_dash_key"); location.reload(); };
applyLang();
if (sessionStorage.getItem("alora_dash_key")) { KEY = sessionStorage.getItem("alora_dash_key"); load(true); }

/* ---------- جلب البيانات (GET) مع JSONP احتياطي ---------- */
function jsonp(url) {
  return new Promise((res, rej) => {
    const cb = "__alora_" + Date.now(), s = document.createElement("script");
    const done = () => { clearTimeout(tm); delete window[cb]; s.remove(); };
    const tm = setTimeout(() => { done(); rej(new Error("timeout")); }, 40000);
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error("network")); };
    s.src = url + "&callback=" + cb; document.head.appendChild(s);
  });
}
async function fetchData() {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(WEB_APP_URL)) throw new Error("SET_URL");
  const url = WEB_APP_URL + (WEB_APP_URL.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY) + "&days=" + $("#range").value;
  try { const r = await fetch(url); return await r.json(); } catch (e) { return await jsonp(url); }
}
async function load(first) {
  const b = $("#refresh"), g = $("#lgo"); b.disabled = g.disabled = true; $("#lerr").textContent = "";
  try {
    const d = await fetchData();
    if (!d.ok) throw new Error(d.error === "unauthorized" ? "BAD_PW" : (d.error || "FAIL"));
    sessionStorage.setItem("alora_dash_key", KEY);
    prep(d); LOADED = true; LASTUPD = Date.now(); $("#login").hidden = true; $("#app").hidden = false;
    $("#upd").textContent = t("upd") + fmtT(LASTUPD);
    fillFilters(); setNote(); render();
  } catch (err) {
    console.error(err);
    const m = err.message === "BAD_PW" ? t("bad_pw") : err.message === "SET_URL" ? t("set_url") : (err.message === "network" || err.message === "timeout") ? t("net_err") : (err.message === "FAIL" ? t("fail") : err.message);
    if (first) { sessionStorage.removeItem("alora_dash_key"); $("#login").hidden = false; $("#app").hidden = true; $("#lerr").textContent = m; }
    else alert(t("upd_fail") + m);
  } finally { b.disabled = g.disabled = false; }
}
$("#refresh").onclick = () => load(false);
$("#range").onchange = () => load(false);

/* ---------- تجهيز الصفوف وإضافة حقول مشتقة (تبدأ بـ _) ---------- */
const normPhone = v => { let d = String(v ?? "").replace(/[٠-٩]/g, x => "٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/\D/g, ""); if (!d) return ""; if (d.length === 12 && d.startsWith("20")) d = "0" + d.slice(2); else if (d.length === 10 && d[0] === "1") d = "0" + d; return d; };
function prep(d) {
  COLS = d.columns || []; MISSING = d.missing || [];
  ROWS = (d.rows || []).map(a => {
    const o = {}; COLS.forEach((c, i) => o[c] = a[i] ?? "");
    const ts = Date.parse(o.timestamp); o._t = isNaN(ts) ? 0 : ts; o._day = o._t ? DAY.format(o._t) : "";
    const parts = String(o.country_city || "").trim().split(/\s*[-–—,]\s*/).filter(Boolean); o._city = parts.length ? parts[parts.length - 1] : "";
    const dv = (String(o.device_type || "") + " " + String(o.user_agent || "")).toLowerCase();
    o._dev = /tablet|ipad/.test(dv) ? "tablet" : /mobile|android|iphone/.test(dv) ? "mobile" : /desktop|windows|macintosh|linux|x11/.test(dv) ? "desktop" : "unknown";
    o._phone = normPhone(o.user_contact);
    o._sid = String(o.session_id || "") || (o.user_ip ? o.user_ip + "|" + o._dev : "");
    o._s = (a.join(" ") + " " + o._phone).toLowerCase();
    return o;
  }).sort((x, y) => y._t - x._t);
}
const evL = e => I18N[LANG].ev[e] || e;
const devL = d => t("d_" + d);
const cityL = c => c || t("unknown");
const colL = c => I18N[LANG].col[c] || c;
function setNote() { $("#note").hidden = !MISSING.length; if (MISSING.length) $("#noteTx").textContent = t("note", MISSING.join(LANG === "ar" ? "، " : ", ")); }
function fillFilters() {
  const keep = { c: $("#fCity").value, e: $("#fEvent").value };
  const opt = (arr, all, lab) => `<option value="">${esc(all)}</option>` + arr.map(v => `<option value="${esc(v)}">${esc(lab ? lab(v) : v)}</option>`).join("");
  $("#fCity").innerHTML = opt([...new Set(ROWS.map(r => r._city).filter(Boolean))].sort(), t("all_cities"));
  $("#fEvent").innerHTML = opt([...new Set(ROWS.map(r => r.event_name).filter(Boolean))].sort(), t("all_events"), evL);
  $("#fCity").value = keep.c; $("#fEvent").value = keep.e;
}

/* ---------- الفلترة: التاريخ والمدينة للكروت والرسوم، والحدث والبحث للجدول ---------- */
function applyFilters() {
  const f = $("#fFrom").value, to = $("#fTo").value, c = $("#fCity").value, e = $("#fEvent").value, q = $("#fQ").value.trim().toLowerCase();
  BASE = ROWS.filter(r => (!f || (r._day && r._day >= f)) && (!to || (r._day && r._day <= to)) && (!c || r._city === c));
  FILT = BASE.filter(r => (!e || r.event_name === e) && (!q || r._s.includes(q)));
}
function render() { applyFilters(); cards(); wishlist(); charts(); if ($("#raw").open) table(); }
["fFrom", "fTo", "fCity"].forEach(id => $("#" + id).onchange = () => { page = 1; render(); });
$("#fEvent").onchange = () => { page = 1; applyFilters(); if ($("#raw").open) table(); };
let qt; $("#fQ").oninput = () => { clearTimeout(qt); qt = setTimeout(() => { page = 1; applyFilters(); table(); }, 200); };
$("#perPage").onchange = () => { page = 1; table(); };
$("#raw").addEventListener("toggle", () => { if ($("#raw").open) { applyFilters(); table(); } });
$("#fReset").onclick = () => { ["fFrom", "fTo", "fCity", "fEvent", "fQ"].forEach(id => $("#" + id).value = ""); page = 1; render(); };

/* ---------- الحسابات ---------- */
const tally = (arr, key) => { const m = new Map(); arr.forEach(r => { const k = typeof key === "function" ? key(r) : r[key]; if (k !== "" && k != null) m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
function cards() {
  const L = BASE, pv = L.filter(r => r.event_name === "PageView"), hasSid = L.some(r => r.session_id);
  const visits = pv.length || L.length;
  const sess = new Set(L.map(r => r._sid).filter(Boolean)).size;
  const ic = L.filter(r => r.event_name === "InitiateCheckout"), icU = new Set(ic.map((r, i) => r._sid || ("r" + i))).size;
  const pur = L.filter(r => r.event_name === "Purchase").length;
  const phones = new Set(L.map(r => r._phone).filter(Boolean)).size;
  const wl = L.filter(r => r.event_name === "Wishlist_Love");
  const wlS = new Set(wl.map(r => r._sid).filter(Boolean)).size, wlP = new Set(wl.map(r => r._phone).filter(Boolean)).size;
  const tc = tally(L.filter(r => r._city), "_city")[0];
  const views = L.filter(r => r.event_name === "ViewContent" && r.product_name);
  const tp = tally(views.length ? views : L.filter(r => r.product_name && !String(r.product_name).includes(" | ")), "product_name")[0];
  const K = (c, i, l, v, s, tx) => `<div class="kpi"><div class="ic ${c}">${icon(i)}</div><div class="tx"><span>${esc(l)}</span><b class="${tx ? "t" : ""}">${esc(v)}</b>${s ? `<small>${esc(s)}</small>` : ""}</div></div>`;
  $("#cards").innerHTML =
    K("c-em", "eye", t("k_visits"), num(visits), pv.length ? "" : t("s_nopv")) +
    K("c-in", "users", t("k_unique"), num(sess), hasSid ? "" : t("s_est")) +
    K("c-cy", "cart", t("k_checkout"), num(icU)) +
    K("c-em", "bag", t("k_purchase"), num(pur)) +
    K("c-am", "phone", t("k_phones"), num(phones)) +
    K("c-ro", "heart", t("k_wish"), num(wl.length), t("s_wish", num(wlS), num(wlP))) +
    K("c-vi", "pin", t("k_city"), tc ? tc[0] : "—", tc ? t("s_events", num(tc[1])) : "", 1) +
    K("c-in", "package", t("k_prod"), tp ? tp[0] : "—", tp ? t("s_views", num(tp[1])) : "", 1);
}

/* ---------- المنتجات الأكثر إعجاباً (Wishlist_Love) ---------- */
let WL = [];
function wishlist() {
  const m = new Map();
  BASE.filter(r => r.event_name === "Wishlist_Love" && r.product_name).forEach(r => {
    const o = m.get(r.product_name) || { name: r.product_name, likes: 0, s: new Set(), p: new Set() };
    o.likes++; if (r._sid) o.s.add(r._sid); if (r._phone) o.p.add(r._phone); m.set(r.product_name, o);
  });
  WL = [...m.values()].sort((a, b) => b.likes - a.likes);
  $("#wlHead").innerHTML = `<tr><th class="rank">#</th><th>${esc(t("w_prod"))}</th><th class="num">${esc(t("w_likes"))}</th><th class="num">${esc(t("w_vis"))}</th><th class="num">${esc(t("w_contacts"))}</th></tr>`;
  $("#wlBody").innerHTML = WL.length ? WL.slice(0, 10).map((o, i) => `<tr><td class="rank">${i + 1}</td><td title="${esc(o.name)}">${esc(o.name)}</td><td class="num">${num(o.likes)}</td><td class="num">${num(o.s.size)}</td><td class="num">${num(o.p.size)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">${esc(t("w_empty"))}</td></tr>`;
}
$("#wlExport").onclick = () => {
  const head = LANG === "ar" ? ["المنتج", "الإعجابات", "الزوار", "الأرقام"] : ["Product", "Likes", "Visitors", "Contacts"];
  download("alora-wishlist-leads-" + DAY.format(Date.now()) + ".csv", [head].concat(WL.map(o => [o.name, o.likes, o.s.size, [...o.p].join(" ")])));
};

/* ---------- الرسوم البيانية (تُعاد بناؤها عند تغيير اللغة) ---------- */
function mk(id, type, labels, datasets, opt) {
  if (CH[id]) CH[id].destroy();
  if (typeof Chart === "undefined") { $("#" + id).parentElement.innerHTML = `<div class='empty'>${esc(t("chart_fail"))}</div>`; return; }
  const rtl = LANG === "ar", base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: type === "doughnut" || datasets.length > 1, position: "bottom", rtl, textDirection: rtl ? "rtl" : "ltr" }, tooltip: { rtl, textDirection: rtl ? "rtl" : "ltr" } } };
  CH[id] = new Chart($("#" + id), { type, data: { labels, datasets }, options: Object.assign(base, opt || {}) });
}
function charts() {
  const L = BASE;
  const vis = new Map(), all = new Map(), days = L.map(r => r._day).filter(Boolean).sort();
  L.forEach(r => { if (!r._day) return; all.set(r._day, (all.get(r._day) || 0) + 1); if (r.event_name === "PageView") vis.set(r._day, (vis.get(r._day) || 0) + 1); });
  const lab = []; if (days.length) { for (let d = new Date(days[0] + "T00:00:00Z"), e = new Date(days[days.length - 1] + "T00:00:00Z"), n = 0; d <= e && n < 400; d.setUTCDate(d.getUTCDate() + 1), n++) lab.push(d.toISOString().slice(0, 10)); }
  mk("cTrend", "line", lab, [
    { label: t("ds_visits"), data: lab.map(d => vis.get(d) || 0), borderColor: PAL[1], backgroundColor: "rgba(16,185,129,.12)", fill: true, tension: .35, pointRadius: 2 },
    { label: t("ds_all"), data: lab.map(d => all.get(d) || 0), borderColor: PAL[0], backgroundColor: PAL[0], tension: .35, pointRadius: 2 }]);
  const ev = tally(L, "event_name");
  mk("cEvents", "doughnut", ev.map(x => evL(x[0])), [{ data: ev.map(x => x[1]), backgroundColor: PAL, borderWidth: 2, borderColor: "#fff" }], { cutout: "62%", onClick: (e, els) => { if (els.length) { $("#fEvent").value = ev[els[0].index][0]; page = 1; $("#raw").open = true; applyFilters(); table(); $("#raw").scrollIntoView({ behavior: "smooth" }); } } });
  const dv = tally(L, "_dev"); mk("cDev", "doughnut", dv.map(x => devL(x[0])), [{ data: dv.map(x => x[1]), backgroundColor: [PAL[1], PAL[0], PAL[2], PAL[6]], borderWidth: 2, borderColor: "#fff" }], { cutout: "62%" });
  const ct = tally(L.filter(r => r._city), "_city").slice(0, 10); mk("cCity", "bar", ct.map(x => x[0]), [{ label: t("ds_events"), data: ct.map(x => x[1]), backgroundColor: PAL[2], borderRadius: 6 }], { indexAxis: "y" });
  const pr = tally(L.filter(r => ["ViewContent", "AddToCart", "Wishlist_Love"].includes(r.event_name) && r.product_name), "product_name").slice(0, 10);
  mk("cProd", "bar", pr.map(x => x[0]), [{ label: t("ds_inter"), data: pr.map(x => x[1]), backgroundColor: PAL[0], borderRadius: 6 }], { indexAxis: "y" });
}

/* ---------- الجدول الخام الشامل (كل الأعمدة) + الصفحات ---------- */
function cell(r, c) {
  const v = r[c];
  if (c === "timestamp") return fmtT(r._t) || v;
  if (c === "user_contact") return r._phone || v;
  if (c === "event_name") return evL(v);
  if (c === "device_type") return devL(r._dev);
  if (c === "traffic_source" && String(v).toLowerCase() === "direct") return t("direct");
  return v;
}
function table() {
  const pp = Number($("#perPage").value) || 25, pages = Math.max(1, Math.ceil(FILT.length / pp)); page = Math.min(page, pages);
  $("#thead").innerHTML = "<tr><th>#</th>" + COLS.map(c => `<th>${esc(colL(c))}</th>`).join("") + "</tr>";
  const slice = FILT.slice((page - 1) * pp, page * pp);
  $("#tbody").innerHTML = slice.length ? slice.map((r, i) => `<tr><td>${(page - 1) * pp + i + 1}</td>` + COLS.map(c => `<td title="${esc(r[c])}">${esc(cell(r, c))}</td>`).join("") + "</tr>").join("") : `<tr><td colspan="${COLS.length + 1}" class="empty">${esc(t("no_data"))}</td></tr>`;
  $("#pinfo").textContent = t("page", page, pages, num(FILT.length));
  $("#prev").disabled = page <= 1; $("#next").disabled = page >= pages;
}
$("#prev").onclick = () => { page--; table(); };
$("#next").onclick = () => { page++; table(); };

/* ---------- تصدير CSV (حماية من حقن المعادلات) ---------- */
function download(name, rows) {
  const q = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""').replace(/\r?\n/g, " ") + '"'; };
  const csv = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
$("#csv").onclick = () => download("alora-analytics-" + DAY.format(Date.now()) + ".csv", [COLS].concat(FILT.map(r => COLS.map(c => r[c]))));
</script>
</body>
