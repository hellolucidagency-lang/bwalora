<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Alora Analytics Dashboard | لوحة تحليلات ألورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --success: #10B981;
  --success-light: #ECFDF5;
  --info: #06B6D4;
  --info-light: #CFFAFE;
  --warning: #F59E0B;
  --warning-light: #FEF3C7;
  --danger: #EF4444;
  --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
  --font-ar: 'Readex Pro', system-ui, -apple-system, sans-serif;
  --font-en: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; transition: all 0.2s ease-in-out; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-main);
  font-family: var(--font-ar);
  font-size: 14px;
  line-height: 1.5;
}

[dir="ltr"] body, [dir="ltr"] button, [dir="ltr"] input, [dir="ltr"] select {
  font-family: var(--font-en);
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; }
input, select {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  outline: none;
}
input:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.btn {
  background: var(--primary);
  color: #FFFFFF;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
}
.btn:hover { background: #4338CA; transform: translateY(-1px); }
.btn.secondary {
  background: #FFFFFF;
  color: var(--text-main);
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn.secondary:hover { background: var(--primary-light); color: var(--primary); border-color: #C7D2FE; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Login Container */
#login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 50%, #E0E7FF 100%);
}
.lbox {
  background: var(--card);
  border-radius: 24px;
  padding: 36px 30px;
  width: min(400px, 100%);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.8);
}
.lbox-icon {
  width: 56px;
  height: 56px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin: 0 auto;
}
.lbox h1 { font-size: 22px; font-weight: 700; margin: 0; color: var(--text-main); }
.lbox p { margin: 0; color: var(--text-muted); font-size: 14px; }
.err { color: var(--danger); font-size: 13px; font-weight: 500; min-height: 20px; }

/* Header & Nav */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-badge {
  background: var(--primary-light);
  color: var(--primary);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 18px;
}
header h1 { font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
header small { color: var(--text-muted); font-size: 12px; font-weight: 400; display: block; }
.nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

main { max-width: 1380px; margin: 0 auto; padding: 24px 16px; }

/* Filters Bar */
.filters {
  background: var(--card);
  border-radius: 18px;
  padding: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 20px;
}
.filters label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1 1 160px;
}

/* KPI Cards Grid */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--kpi-color, var(--primary));
}
.kpi-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.kpi-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.kpi-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--kpi-bg, var(--primary-light));
  color: var(--kpi-color, var(--primary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.kpi b { font-size: 26px; font-weight: 700; color: var(--text-main); line-height: 1.2; word-break: break-word; }
.kpi b.text-sm { font-size: 16px; }
.kpi small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 6px; font-weight: 400; }

/* Charts Layout */
.charts {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 20px;
  margin-bottom: 24px;
}
.ch {
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  grid-column: span 6;
}
.ch.full { grid-column: span 12; }
.ch.span-4 { grid-column: span 4; }
.ch.span-8 { grid-column: span 8; }

@media (max-width: 992px) {
  .ch, .ch.span-4, .ch.span-8 { grid-column: span 12; }
}

.ch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.ch-header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-main); }
.cv { position: relative; height: 280px; width: 100%; }

/* Collapsible Table Section */
.tw-section {
  background: var(--card);
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 30px;
}
.tw-toggle-bar {
  padding: 16px 20px;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.tw-toggle-bar h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tbar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.scroll { overflow-x: auto; max-height: 500px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: start; }
th {
  background: #F1F5F9;
  color: var(--text-muted);
  font-weight: 600;
  padding: 12px 14px;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-main);
}
tr:hover td { background: var(--primary-light); }
.pg {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #FFFFFF;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lf" autocomplete="off">
    <div class="lbox-icon">📊</div>
    <h1 data-i18n="login_title">لوحة تحليلات ألورا</h1>
    <p data-i18n="login_sub">أدخلي كلمة السر للوصول للوحة المبيعات والزيارات</p>
    <input type="password" id="pw" placeholder="••••••••" required autofocus>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn" id="lgo" type="submit" data-i18n="login_btn">دخول اللوحة</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">
      <div class="brand-badge">ALORA</div>
      <div>
        <h1 data-i18n="dash_title">لوحة تحليلات المتجر</h1>
        <small id="upd"></small>
      </div>
    </div>
    <div class="nav-actions">
      <select id="range">
        <option value="0" data-i18n="range_all">كل البيانات</option>
        <option value="7" data-i18n="range_7">آخر 7 أيام</option>
        <option value="30" data-i18n="range_30" selected>آخر 30 يوم</option>
        <option value="90" data-i18n="range_90">آخر 90 يوم</option>
      </select>
      <button class="btn secondary" id="langToggle" type="button">English 🌐</button>
      <button class="btn secondary" id="refresh" type="button">🔄 <span data-i18n="btn_refresh">تحديث</span></button>
      <button class="btn secondary" id="logout" type="button">🚪 <span data-i18n="btn_logout">خروج</span></button>
    </div>
  </header>

  <main>
    <!-- Filters -->
    <div class="filters">
      <label><span data-i18n="filter_from">من تاريخ</span><input type="date" id="fFrom"></label>
      <label><span data-i18n="filter_to">إلى تاريخ</span><input type="date" id="fTo"></label>
      <label><span data-i18n="filter_city">المدينة</span><select id="fCity"><option value="" data-i18n="all_cities">كل المدن</option></select></label>
      <button class="btn secondary" id="fReset" type="button" style="align-self: flex-end;" data-i18n="btn_reset">إعادة ضبط</button>
    </div>

    <!-- Executive KPI Cards -->
    <section class="cards" id="cards"></section>

    <!-- Analytics Charts -->
    <section class="charts">
      <div class="ch full">
        <div class="ch-header">
          <h3 data-i18n="chart_trend">📈 حركية الزيارات والمبيعات اليومية</h3>
        </div>
        <div class="cv"><canvas id="cTrend"></canvas></div>
      </div>

      <div class="ch span-4">
        <div class="ch-header">
          <h3 data-i18n="chart_events">⚡ توزيع الأحداث (Events)</h3>
        </div>
        <div class="cv"><canvas id="cEvents"></canvas></div>
      </div>

      <div class="ch span-4">
        <div class="ch-header">
          <h3 data-i18n="chart_devices">📱 أنواع الأجهزة المستخدمة</h3>
        </div>
        <div class="cv"><canvas id="cDev"></canvas></div>
      </div>

      <div class="ch span-4">
        <div class="ch-header">
          <h3 data-i18n="chart_cities">🌍 أعلى المدن والمحافظات</h3>
        </div>
        <div class="cv"><canvas id="cCity"></canvas></div>
      </div>

      <div class="ch full">
        <div class="ch-header">
          <h3 data-i18n="chart_products">💎 المنتجات الأكثر مشاهدة وتفاعلاً</h3>
        </div>
        <div class="cv"><canvas id="cProd"></canvas></div>
      </div>
    </section>

    <!-- Detailed Raw Data Table (Collapsible) -->
    <section class="tw-section">
      <div class="tw-toggle-bar" id="twToggle">
        <h3>📄 <span data-i18n="raw_data_title">سجلات البيانات التفصيلية (Raw Data)</span></h3>
        <span id="twIcon" style="font-size: 18px; color: var(--text-muted);">▼</span>
      </div>
      <div id="twContent" hidden>
        <div class="tbar">
          <input id="fQ" type="search" placeholder="🔎 بحث في السجلات..." style="flex:1 1 240px">
          <select id="fEvent"><option value="" data-i18n="all_events">كل الأحداث</option></select>
          <select id="perPage"><option>25</option><option>50</option><option>100</option></select>
          <button class="btn secondary" id="csv" type="button">⬇️ <span data-i18n="btn_export">تصدير CSV</span></button>
        </div>
        <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <div class="pg">
          <button class="btn secondary" id="prev" type="button" data-i18n="btn_prev">السابق</button>
          <span id="pinfo"></span>
          <button class="btn secondary" id="next" type="button" data-i18n="btn_next">التالي</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* ================= Script Configuration ================= */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdewMZzuBkDQ2vWbU1IrOEYELpYlp5H1YJzbtrp5i3tSyW7LKO3cgRGJqPsrx9c8Df9g/exec";
const TZ = "Africa/Cairo";
/* ======================================================== */

const I18N = {
  ar: {
    login_title: "لوحة تحليلات ألورا",
    login_sub: "أدخلي كلمة السر للوصول للوحة المبيعات والزيارات",
    login_btn: "دخول اللوحة",
    dash_title: "لوحة تحليلات المتجر",
    range_all: "كل البيانات", range_7: "آخر 7 أيام", range_30: "آخر 30 يوم", range_90: "آخر 90 يوم",
    btn_refresh: "تحديث", btn_logout: "خروج", filter_from: "من تاريخ", filter_to: "إلى تاريخ", filter_city: "المدينة", all_cities: "كل المدن",
    btn_reset: "إعادة ضبط",
    kpi_visits: "إجمالي الزيارات", kpi_unique: "الزوار الفريدون", kpi_revenue: "إجمالي المبيعات",
    kpi_checkout: "بدء إتمام الطلب", kpi_purchases: "عمليات الشراء الناجحة", kpi_contacts: "أرقام أسرّت بالاهتمام",
    kpi_top_city: "أعلى مدينة", kpi_top_prod: "المنتج الأكثر مشاهدة",
    chart_trend: "📈 حركية الزيارات والمبيعات اليومية", chart_events: "⚡ توزيع الأحداث (Events)", chart_devices: "📱 أنواع الأجهزة المستخدمة", chart_cities: "🌍 أعلى المدن والمحافظات", chart_products: "💎 المنتجات الأكثر مشاهدة وتفاعلاً",
    raw_data_title: "سجلات البيانات التفصيلية (Raw Data)", all_events: "كل الأحداث", btn_export: "تصدير CSV", btn_prev: "السابق", btn_next: "التالي",
    err_pw: "كلمة السر غير صحيحة.", err_conn: "تعذّر الاتصال بالسكربت، تأكدي من الرابط والنشر."
  },
  en: {
    login_title: "Alora Analytics Dashboard",
    login_sub: "Enter passcode to access sales & store analytics",
    login_btn: "Access Dashboard",
    dash_title: "Store Analytics Dashboard",
    range_all: "All Time", range_7: "Last 7 Days", range_30: "Last 30 Days", range_90: "Last 90 Days",
    btn_refresh: "Refresh", btn_logout: "Logout", filter_from: "From Date", filter_to: "To Date", filter_city: "City", all_cities: "All Cities",
    btn_reset: "Reset Filters",
    kpi_visits: "Total Visits", kpi_unique: "Unique Visitors", kpi_revenue: "Total Sales Revenue",
    kpi_checkout: "Initiate Checkout", kpi_purchases: "Completed Purchases", kpi_contacts: "Captured Contacts",
    kpi_top_city: "Top City", kpi_top_prod: "Most Viewed Product",
    chart_trend: "📈 Daily Traffic & Conversions", chart_events: "⚡ Event Distribution", chart_devices: "📱 Device Types", chart_cities: "🌍 Top Cities & Regions", chart_products: "💎 Top Interacted Products",
    raw_data_title: "Detailed Log Records (Raw Data)", all_events: "All Events", btn_export: "Export CSV", btn_prev: "Previous", btn_next: "Next",
    err_pw: "Incorrect passcode.", err_conn: "Connection failed. Please verify Web App URL & deployment."
  }
};

let CURR_LANG = localStorage.getItem("alora_lang") || "ar";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TIME = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const fmtT = t => { if (!t) return ""; const p = Object.fromEntries(TIME.formatToParts(t).map(x => [x.type, x.value])); return `${p.day}/${p.month}/${p.year} | ${p.hour}:${p.minute}`; };

/* Modern Vibrant Palette (Indigo, Emerald, Cyan, Rose, Amber) */
const PALETTE = ["#4F46E5", "#10B981", "#06B6D4", "#F43F5E", "#F59E0B", "#8B5CF6", "#EC4899", "#3B82F6"];

let KEY = "", COLS = [], ROWS = [], BASE = [], FILT = [], page = 1, CH = {};

/* Bilingual Toggle */
function setLang(lang) {
  CURR_LANG = lang;
  localStorage.setItem("alora_lang", lang);
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.documentElement.lang = lang;
  $("#langToggle").textContent = lang === "ar" ? "English 🌐" : "العربية 🌐";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  if (ROWS.length) render();
}
$("#langToggle").onclick = () => setLang(CURR_LANG === "ar" ? "en" : "ar");
setLang(CURR_LANG);

/* Collapsible Table */
$("#twToggle").onclick = () => {
  const content = $("#twContent");
  const icon = $("#twIcon");
  content.hidden = !content.hidden;
  icon.textContent = content.hidden ? "▼" : "▲";
};

/* Authentication & Data Fetching */
$("#lf").addEventListener("submit", e => { e.preventDefault(); KEY = $("#pw").value; load(true); });
$("#logout").onclick = () => { sessionStorage.removeItem("alora_dash_key"); location.reload(); };
if (sessionStorage.getItem("alora_dash_key")) { KEY = sessionStorage.getItem("alora_dash_key"); load(true); }

function jsonp(url) {
  return new Promise((res, rej) => {
    const cb = "__alora_" + Date.now(), s = document.createElement("script");
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error("timeout")); }, 40000);
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error("network")); };
    s.src = url + "&callback=" + cb; document.head.appendChild(s);
  });
}
async function fetchData() {
  const url = WEB_APP_URL + (WEB_APP_URL.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY) + "&days=" + $("#range").value;
  try { const r = await fetch(url); return await r.json(); } catch (e) { return await jsonp(url); }
}
async function load(first) {
  const b = $("#refresh"), g = $("#lgo"); b.disabled = g.disabled = true; $("#lerr").textContent = "";
  try {
    const d = await fetchData();
    if (!d.ok) throw new Error(d.error === "unauthorized" ? I18N[CURR_LANG].err_pw : (d.error || "Error"));
    sessionStorage.setItem("alora_dash_key", KEY);
    prep(d); $("#login").hidden = true; $("#app").hidden = false;
    $("#upd").textContent = (CURR_LANG === "ar" ? "آخر تحديث: " : "Last updated: ") + fmtT(Date.now());
    fillFilters(); render();
  } catch (err) {
    console.error(err);
    if (first) {
      sessionStorage.removeItem("alora_dash_key"); $("#login").hidden = false; $("#app").hidden = true;
      $("#lerr").textContent = (err.message === "network" || err.message === "timeout") ? I18N[CURR_LANG].err_conn : err.message;
    } else alert("Error: " + err.message);
  } finally { b.disabled = g.disabled = false; }
}
$("#refresh").onclick = () => load(false);
$("#range").onchange = () => load(false);

/* Data Preparation */
function prep(d) {
  COLS = d.columns || [];
  ROWS = (d.rows || []).map(a => {
    const o = {}; COLS.forEach((c, i) => o[c] = a[i] ?? "");
    const t = Date.parse(o.timestamp); o._t = isNaN(t) ? 0 : t;
    o._day = o._t ? new Date(o._t).toISOString().slice(0, 10) : "";
    const parts = String(o.country_city || "").trim().split(/\s*[-–—,]\s*/).filter(Boolean);
    o._city = parts.length ? parts[parts.length - 1] : (CURR_LANG === "ar" ? "غير محدد" : "Unknown");
    const dv = (String(o.device_type || "") + " " + String(o.user_agent || "")).toLowerCase();
    o._dev = /tablet|ipad/.test(dv) ? (CURR_LANG === "ar" ? "تابلت" : "Tablet") : /mobile|android|iphone/.test(dv) ? (CURR_LANG === "ar" ? "موبايل" : "Mobile") : (CURR_LANG === "ar" ? "ديسكتوب" : "Desktop");
    o._val = parseFloat(o.value) || 0;
    o._s = (a.join(" ") + " " + o.user_contact).toLowerCase();
    return o;
  }).sort((x, y) => y._t - x._t);
}

function fillFilters() {
  const keep = { c: $("#fCity").value, e: $("#fEvent").value };
  const opt = (arr, all) => `<option value="">${all}</option>` + arr.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  $("#fCity").innerHTML = opt([...new Set(ROWS.map(r => r._city))].sort(), I18N[CURR_LANG].all_cities);
  $("#fEvent").innerHTML = opt([...new Set(ROWS.map(r => r.event_name).filter(Boolean))].sort(), I18N[CURR_LANG].all_events);
  $("#fCity").value = keep.c; $("#fEvent").value = keep.e;
}

function applyFilters() {
  const f = $("#fFrom").value, t = $("#fTo").value, c = $("#fCity").value, e = $("#fEvent").value, q = $("#fQ").value.trim().toLowerCase();
  BASE = ROWS.filter(r => (!f || (r._day && r._day >= f)) && (!t || (r._day && r._day <= t)) && (!c || r._city === c));
  FILT = BASE.filter(r => (!e || r.event_name === e) && (!q || r._s.includes(q)));
}
function render() { applyFilters(); cards(); charts(); table(); }
["fFrom", "fTo", "fCity"].forEach(id => $("#" + id).onchange = () => { page = 1; render(); });
$("#fEvent").onchange = () => { page = 1; applyFilters(); table(); };
let qt; $("#fQ").oninput = () => { clearTimeout(qt); qt = setTimeout(() => { page = 1; applyFilters(); table(); }, 200); };
$("#perPage").onchange = () => { page = 1; table(); };
$("#fReset").onclick = () => { ["fFrom", "fTo", "fCity", "fEvent", "fQ"].forEach(id => $("#" + id).value = ""); page = 1; render(); };

/* Render Executive Cards */
const tally = (arr, key) => { const m = new Map(); arr.forEach(r => { const k = typeof key === "function" ? key(r) : r[key]; if (k !== "" && k != null) m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
function cards() {
  const L = BASE;
  const pv = L.filter(r => r.event_name === "PageView");
  const visits = pv.length || L.length;
  const sess = new Set(L.map(r => r.session_id || r.user_ip).filter(Boolean)).size;
  const purchases = L.filter(r => r.event_name === "Purchase");
  const totalRev = L.reduce((acc, r) => acc + r._val, 0);
  const ic = L.filter(r => r.event_name === "InitiateCheckout").length;
  const phones = new Set(L.map(r => r.user_contact).filter(Boolean)).size;
  const tc = tally(L.filter(r => r._city !== "غير محدد" && r._city !== "Unknown"), "_city")[0];
  const tp = tally(L.filter(r => r.product_name && !String(r.product_name).includes(" | ")), "product_name")[0];

  const K = (title, val, sub, icon, color, bg, isSm) => `
    <div class="kpi" style="--kpi-color: ${color}; --kpi-bg: ${bg};">
      <div class="kpi-head">
        <span class="kpi-title">${title}</span>
        <div class="kpi-icon">${icon}</div>
      </div>
      <b class="${isSm ? 'text-sm' : ''}">${esc(val)}</b>
      ${sub ? `<small>${esc(sub)}</small>` : ''}
    </div>
  `;

  const lang = I18N[CURR_LANG];
  $("#cards").innerHTML =
    K(lang.kpi_visits, visits.toLocaleString("en"), pv.length ? "PageView Events" : "All Traffic", "👁️", "#4F46E5", "#EEF2FF") +
    K(lang.kpi_unique, sess.toLocaleString("en"), "Unique Sessions", "👥", "#06B6D4", "#CFFAFE") +
    K(lang.kpi_revenue, totalRev > 0 ? `${totalRev.toLocaleString("en")} EGP` : "—", `${purchases.length} Purchase Events`, "💰", "#10B981", "#ECFDF5") +
    K(lang.kpi_checkout, ic.toLocaleString("en"), "Initiate Checkout", "🛒", "#F59E0B", "#FEF3C7") +
    K(lang.kpi_purchases, purchases.length.toLocaleString("en"), "Completed Orders", "🎉", "#10B981", "#ECFDF5") +
    K(lang.kpi_contacts, phones.toLocaleString("en"), "Captured Leads", "📞", "#EC4899", "#FCE7F3") +
    K(lang.kpi_top_city, tc ? tc[0] : "—", tc ? `${tc[1]} events` : "", "📍", "#8B5CF6", "#F3E8FF", true) +
    K(lang.kpi_top_prod, tp ? tp[0] : "—", tp ? `${tp[1]} views` : "", "💎", "#F43F5E", "#FFE4E6", true);
}

/* Render Modern Charts */
function mk(id, type, labels, datasets, opt) {
  if (CH[id]) CH[id].destroy();
  if (typeof Chart === "undefined") return;
  CH[id] = new Chart($("#" + id), {
    type,
    data: { labels, datasets },
    options: Object.assign({
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: type === "doughnut" || datasets.length > 1, position: "bottom", labels: { boxWidth: 12, font: { family: CURR_LANG === "ar" ? "Readex Pro" : "Plus Jakarta Sans" } } }
      }
    }, opt || {})
  });
}

function charts() {
  const L = BASE;
  // 1) Trend Chart
  const vis = new Map(), all = new Map(), days = L.map(r => r._day).filter(Boolean).sort();
  L.forEach(r => { if (!r._day) return; all.set(r._day, (all.get(r._day) || 0) + 1); if (r.event_name === "PageView") vis.set(r._day, (vis.get(r._day) || 0) + 1); });
  const lab = []; if (days.length) { for (let d = new Date(days[0] + "T00:00:00Z"), e = new Date(days[days.length - 1] + "T00:00:00Z"), n = 0; d <= e && n < 400; d.setUTCDate(d.getUTCDate() + 1), n++) lab.push(d.toISOString().slice(0, 10)); }
  mk("cTrend", "line", lab, [
    { label: CURR_LANG === "ar" ? "الزيارات (PageView)" : "Visits (PageView)", data: lab.map(d => vis.get(d) || 0), borderColor: "#4F46E5", backgroundColor: "rgba(79, 70, 229, 0.1)", fill: true, tension: 0.3 },
    { label: CURR_LANG === "ar" ? "كل الأحداث" : "All Events", data: lab.map(d => all.get(d) || 0), borderColor: "#06B6D4", backgroundColor: "transparent", tension: 0.3 }
  ]);

  // 2) Event Types Donut
  const ev = tally(L, "event_name");
  mk("cEvents", "doughnut", ev.map(x => x[0]), [{ data: ev.map(x => x[1]), backgroundColor: PALETTE }]);

  // 3) Devices
  const dv = tally(L, "_dev");
  mk("cDev", "doughnut", dv.map(x => x[0]), [{ data: dv.map(x => x[1]), backgroundColor: ["#10B981", "#4F46E5", "#F59E0B"] }]);

  // 4) Top Cities
  const ct = tally(L, "_city").slice(0, 8);
  mk("cCity", "bar", ct.map(x => x[0]), [{ label: CURR_LANG === "ar" ? "عدد الأحداث" : "Events", data: ct.map(x => x[1]), backgroundColor: "#4F46E5", borderRadius: 8 }], { indexAxis: "y" });

  // 5) Top Products
  const pr = tally(L.filter(r => r.product_name), "product_name").slice(0, 10);
  mk("cProd", "bar", pr.map(x => x[0]), [{ label: CURR_LANG === "ar" ? "التفاعلات" : "Interactions", data: pr.map(x => x[1]), backgroundColor: "#10B981", borderRadius: 8 }], { indexAxis: "y" });
}

/* Table */
function cell(r, c) { if (c === "timestamp") return fmtT(r._t) || r[c]; return r[c]; }
function table() {
  const pp = Number($("#perPage").value) || 25, pages = Math.max(1, Math.ceil(FILT.length / pp)); page = Math.min(page, pages);
  $("#thead").innerHTML = "<tr><th>#</th>" + COLS.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";
  const slice = FILT.slice((page - 1) * pp, page * pp);
  $("#tbody").innerHTML = slice.length ? slice.map((r, i) => `<tr><td>${(page - 1) * pp + i + 1}</td>` + COLS.map(c => `<td title="${esc(r[c])}">${esc(cell(r, c))}</td>`).join("") + "</tr>").join("") : `<tr><td colspan="${COLS.length + 1}" class="empty">No records found.</td></tr>`;
  $("#pinfo").textContent = `${CURR_LANG === 'ar' ? 'صفحة' : 'Page'} ${page} / ${pages} — ${FILT.length.toLocaleString("en")} ${CURR_LANG === 'ar' ? 'سجل' : 'records'}`;
  $("#prev").disabled = page <= 1; $("#next").disabled = page >= pages;
}
$("#prev").onclick = () => { page--; table(); };
$("#next").onclick = () => { page++; table(); };

/* CSV Export */
$("#csv").onclick = () => {
  const q = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""').replace(/\r?\n/g, " ") + '"'; };
  const csv = "\ufeff" + [COLS.map(q).join(",")].concat(FILT.map(r => COLS.map(c => q(r[c])).join(","))).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "alora-analytics-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
